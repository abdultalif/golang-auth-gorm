version: "3.8"

services:
  backend-goauth:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: talif
      DB_PASSWORD: password
      DB_NAME: goauth
      APP_PORT: 3000
      APP_ENV: production
      EMAIL_FROM: pizzaaaa21@gmail.com
      EMAIL_PASSWORD: ckozqicaqsqtmgkw
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      JWT_SECRET: IyBLe4FxXOEghKvqOJlhWe63emkX7tOJeHubuh83L5PckRbF5o
      JWT_REFRESH_SECRET: 5X91uK1G8dSJDWvDfJCGzM2IsSprt11vnaaGPLUTrBdsnVmYX0
      JWT_EXPIRE_MINUTES: 180
      JWT_REFRESH_EXPIRE_MINUTES: 1440
    ports:
      - "3000:3000"
    links:
      - postgres

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talif
      POSTGRES_PASSWORD: password
      POSTGRES_DB: goauth
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talif -d goauth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
